name: Selenium Tests

# 1. 트리거 조건: main 브랜치에 코드가 push되거나 PR이 날아올 때 실행
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  selenium-run:
    # 2. 깃허브가 제공하는 최신 우분투 리눅스 가상 컴퓨터 대여
    runs-on: ubuntu-latest

    steps:
    # 3. 현재 레포지토리의 소스코드를 가상 컴퓨터로 복사해오기
    - name: Checkout repository
      uses: actions/checkout@v4

    # 4. 가상 컴퓨터에 파이썬(Python 3.10) 설치하기
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 5. 리눅스 환경에 실제 크롬 브라우저 강제 설치 (셀레늄 구동용)
    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    # 6. 셀레늄 테스트에 필요한 의존성 라이브러리 설치
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager

    # 7. 내가 짠 셀레늄 파이썬 스크립트 실행하기
    - name: Run Selenium Test
      run: |
        python Selenium/sel_test.py

    # 8. [트러블슈팅/디버깅용] 테스트 실패 시 로그 및 결과물 보존하기
    # 테스트가 실패(failure)했을 때만 작동하도록 조건을 걸어둠
    - name: Upload Selenium Artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: selenium-test-results
        path: |
          *.log
          *.png
          test-results/